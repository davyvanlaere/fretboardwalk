<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">

<title>Shape Explorer | Fretboardwalk</title>
<!-- Prototype: deliberately not linked from navigation or the sitemap yet, and
     kept out of search on purpose until it's decided whether this becomes a
     real feature. Remove this tag along with wiring it in. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.5' fill='%2322d3ee'/%3E%3Cg fill='%2304212a'%3E%3Cellipse cx='11.6' cy='22.6' rx='5.6' ry='4.3' transform='rotate(-22 11.6 22.6)'/%3E%3Crect x='15.3' y='6.6' width='2.1' height='16.4' rx='1'/%3E%3Cpath d='M17.4 6.2c4.6 1.8 8.4 4.3 8.4 8.7 0 2.5-1.2 4.4-2.4 5.3 1.1-3.7-1.4-6.4-6-8.7z'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>

<!-- The board itself (fretboard-wrap, neck-scroll, svg#board, the note/cell
     classes, the --neck/--string/--live/--seek tokens) is style.css — the
     trainer's own stylesheet — so this reuses the real board look pixel for
     pixel instead of a redrawn approximation that can drift from it. -->
<link rel="stylesheet" href="style.css?v=20260808c">
<link rel="stylesheet" href="shape-explorer.css?v=1">
</head>
<body>

<div class="explorer">

  <header class="ex-head">
    <a class="ex-brand" href="/">
      <span class="ex-logo"><svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><ellipse cx="11.6" cy="22.6" rx="5.6" ry="4.3" transform="rotate(-22 11.6 22.6)"/><rect x="15.3" y="6.6" width="2.1" height="16.4" rx="1"/><path d="M17.4 6.2c4.6 1.8 8.4 4.3 8.4 8.7 0 2.5-1.2 4.4-2.4 5.3 1.1-3.7-1.4-6.4-6-8.7z"/></g></svg></span>
      <b>Fretboardwalk</b>
    </a>
    <span class="ex-badge">Shape Explorer</span>
  </header>

  <div class="ex-controls">
    <label class="ex-key">Key
      <select id="keySelect" aria-label="Key"></select>
    </label>
    <button class="ex-sound" id="soundToggle" type="button" aria-pressed="true" title="Sound on/off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path class="ex-wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="ex-chips" id="degreeChips" role="group" aria-label="Toggle scale degrees"></div>

  <div class="ex-row">
    <div class="ex-showing"><span>Showing</span><span id="showingList" class="ex-showing-list">—</span></div>
    <button class="ex-clear" id="clearBtn" type="button">Clear</button>
  </div>

  <div class="ex-presets" id="presets" role="group" aria-label="Preset shapes"></div>

  <div class="board-area">
    <div class="fretboard-wrap" id="fretboardWrap">
      <div class="string-labels" id="stringLabels"><svg id="gutter"></svg></div>
      <div class="neck-scroll" id="neckScroll">
        <svg id="board"></svg>
      </div>
    </div>
  </div>

</div>

<script src="shape-explorer.js?v=1"></script>
</body>
</html>
