<title>Notes in a Key | Fretboardwalk</title>
<meta name="description" content="Name the seven notes of a random major key. Miss one and the circle of fifths shows you why, one sharp or flat per step from C.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.fretboardwalk.com/key-quiz">

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>

<!-- The page shell — tokens, top bar, type, the .deg note tokens — is the
     guide pages' stylesheet; key-quiz.css only adds the quiz itself. -->
<link rel="stylesheet" href="help.css?v=20260808b">
<link rel="stylesheet" href="key-quiz.css?v=6">
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">
    <span class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><ellipse cx="11.6" cy="22.6" rx="5.6" ry="4.3" transform="rotate(-22 11.6 22.6)"/><rect x="15.3" y="6.6" width="2.1" height="16.4" rx="1"/><path d="M17.4 6.2c4.6 1.8 8.4 4.3 8.4 8.7 0 2.5-1.2 4.4-2.4 5.3 1.1-3.7-1.4-6.4-6-8.7z"/></g></svg></span>
    <b>Fretboardwalk</b>
  </a>
  <a class="open-app" href="/">Open the trainer</a>
</div>

<main class="wrap">

  <nav class="crumbs" aria-label="Breadcrumb">
    <ol>
      <li><a href="/">Home</a></li>
      <li><a href="/toolbox">Toolbox</a></li>
      <li aria-current="page">Key quiz</li>
    </ol>
  </nav>

  <h1>Name the notes in a key</h1>
  <p class="lede">A major key uses every letter from A to G exactly once — the only question is which ones are sharp or flat. Miss one and the circle of fifths shows you why.</p>

  <section class="kq-card" id="kqCard" aria-labelledby="kqAsk">
    <div class="kq-top">
      <h2 class="kq-ask" id="kqAsk">Which notes are in <strong id="kqKey"></strong>?</h2>
      <div class="kq-streak">Streak <b id="kqStreak">0</b></div>
    </div>
    <form id="kqForm">
      <div class="kq-slots" id="kqSlots"></div>
      <button class="kq-btn" id="kqCheck" type="submit">Check</button>
    </form>
    <p class="kq-verdict" id="kqVerdict" role="status"></p>
  </section>

  <section class="kq-why" id="kqWhy" aria-label="Why, on the circle of fifths" hidden>
    <figure class="kq-fig">
      <svg id="kqCircle" viewBox="0 0 360 360" role="img"></svg>
      <p class="kq-scale" id="kqScale"></p>
      <figcaption class="kq-legend">
        <span><i class="kq-sw key"></i>the key</span>
        <span><i class="kq-sw step"></i>added by that step</span>
        <span><i class="kq-sw seek"></i>the one you missed</span>
        <span><i class="kq-sw miss"></i>yours, added elsewhere</span>
      </figcaption>
    </figure>
    <div>
      <div class="kq-explain" id="kqExplain"></div>
      <button class="kq-btn" id="kqNext" type="button">Next key →</button>
    </div>
  </section>

</main>

<script src="fifths.js?v=1"></script>
<script src="key-quiz.js?v=6"></script>
</body>
</html>
